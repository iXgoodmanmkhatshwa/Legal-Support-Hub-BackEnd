spring.config.import=optional:file:.env[.properties]

spring.application.name=legal-support-backend

# =========================
# DATABASE
# =========================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# =========================
# SECURITY
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
security.expected-audience=${ENTRA_BACKEND_CLIENT_ID}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.oauth2.jwt=TRACE
logging.level.org.springframework.web=DEBUG

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# =========================
# FILE UPLOADS
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=105MB

# =========================
# SERVER
# =========================
server.port=${PORT:8080}