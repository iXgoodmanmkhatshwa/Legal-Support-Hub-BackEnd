spring.config.import=optional:file:.env[.properties]

spring.application.name=legal-support-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
security.expected-audience=${ENTRA_BACKEND_CLIENT_ID}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.oauth2.jwt=TRACE
logging.level.org.springframework.web=DEBUG

# Hibernate must only validate, never modify the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is the only schema migration mechanism.
spring.flyway.enabled=true

# Keep this false after the existing database has been baselined.
spring.flyway.baseline-on-migrate=true

# Safety: never allow Flyway clean from this application.
spring.flyway.clean-disabled=true




server.port=8080